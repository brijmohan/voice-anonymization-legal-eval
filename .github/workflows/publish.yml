name: Publish to PyPI

# Releases are cut by pushing a tag, so the published artifact always
# corresponds to a commit that CI has already tested.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*

      - name: Check the tag matches the package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(python -c "import re,pathlib; print(re.search(r'\"([^\"]+)\"', pathlib.Path('legal_eval/__about__.py').read_text()).group(1))")
          echo "tag=$TAG package=$PKG"
          test "$TAG" = "$PKG"

      - name: Verify the wheel ships the published results
        run: |
          python -m venv /tmp/check
          /tmp/check/bin/pip install --quiet dist/*.whl
          /tmp/check/bin/python -c "
          from legal_eval.paper import load_paper_results
          r = load_paper_results()
          for m in ('singling_out', 'linkability', 'eer'):
              for L in (1, 3, 30):
                  assert set(r[m][L]) == {'original', 'informed', 'semi_informed', 'ignorant'}, (m, L)
          print('all nine panels load from the wheel')
          "

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    # Trusted Publishing: PyPI authenticates the workflow itself, so no API
    # token is stored in the repository.
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
