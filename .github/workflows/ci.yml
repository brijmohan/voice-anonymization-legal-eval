name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check legal_eval tests
      - name: Test
        run: pytest -q --cov=legal_eval --cov-report=term-missing
      - name: Reproduce the published reference curves
        run: python examples/02_reproduce_paper_figures.py --output-dir /tmp/figures
      - name: End-to-end demo
        run: legal-eval demo --output-dir /tmp/demo

      - name: Build and check the distribution
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*

  vpc-adapter:
    # Covers legal_eval.vpc, which needs torch. Kept out of the main matrix so
    # three Python versions do not each download a 200 MB wheel.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install with the vpc extra
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev]"
      - name: Test the VPC adapter
        run: pytest tests/test_vpc.py -q

  no-private-material:
    # A public repository for a privacy paper must not leak personal data of
    # its own. This nearly happened once; see the script's docstring.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/check_no_private_material.py
