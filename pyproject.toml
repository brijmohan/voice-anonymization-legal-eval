[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-anonymization-legal-eval"
dynamic = ["version"]
description = "Legally validated evaluation framework for voice anonymization (Interspeech 2025)"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Nathalie Vauquier" },
    { name = "Brij Mohan Lal Srivastava", email = "brij@nijta.com" },
    { name = "Seyed Ahmad Hosseini" },
    { name = "Emmanuel Vincent" },
]
keywords = [
    "voice anonymization",
    "speaker anonymization",
    "privacy",
    "GDPR",
    "singling out",
    "linkability",
    "speech",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
]

[project.optional-dependencies]
# Reading the HDF5 x-vector files the extraction toolkits write.
hdf5 = ["h5py>=3.1"]
plot = ["matplotlib>=3.4"]
progress = ["tqdm>=4.62"]
# Reading VoicePrivacy Challenge embedding caches, which are torch tensors.
# Always present in a VPC environment, so this is only for use outside one.
vpc = ["torch>=1.9"]
all = ["h5py>=3.1", "matplotlib>=3.4", "tqdm>=4.62"]
dev = [
    "h5py>=3.1",
    "matplotlib>=3.4",
    "tqdm>=4.62",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://github.com/brijmohan/voice-anonymization-legal-eval"
Documentation = "https://github.com/brijmohan/voice-anonymization-legal-eval#readme"
Source = "https://github.com/brijmohan/voice-anonymization-legal-eval"
Issues = "https://github.com/brijmohan/voice-anonymization-legal-eval/issues"
Changelog = "https://github.com/brijmohan/voice-anonymization-legal-eval/blob/main/CHANGELOG.md"
Paper = "https://doi.org/10.21437/Interspeech.2025-1699"
Dataset = "https://doi.org/10.5281/zenodo.23142030"

[project.scripts]
legal-eval = "legal_eval.cli:main"

[tool.setuptools.dynamic]
version = { attr = "legal_eval.__about__.__version__" }

[tool.setuptools.packages.find]
include = ["legal_eval*"]

[tool.setuptools.package-data]
# The published results behind the paper figure travel with the package, so
# load_paper_results() works from a wheel and not only from a checkout.
legal_eval = ["data/paper_results/*.csv", "data/paper_results/*.json",
              "data/paper_results/README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # Our own warnings are bugs; fail on them.
    "error",
    # Third-party noise we cannot fix, and cannot usefully enumerate. Older
    # matplotlib, which is what Python 3.9 resolves to, calls a range of
    # pyparsing APIs that pyparsing has since renamed: at import, and again
    # whenever mathtext is parsed for an axis label. Ignore the category rather
    # than chasing each message. pyparsing ships with matplotlib, which the dev
    # extra installs, so the category always resolves when the suite runs.
    "ignore::pyparsing.warnings.PyparsingDeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = ["E501"]
